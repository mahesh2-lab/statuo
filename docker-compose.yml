  # 3. Statuo Unified Fullstack Application (Frontend + Backend + Scheduler)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statuo_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
    healthcheck:
      test: [ "CMD-SHELL", "wget -O /dev/null --spider http://localhost:3000/api/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "${PORT:-3000}:3000"
    # Use the default Docker bridge so outbound internet traffic (e.g. Neon DB
    # on port 5432) is routed via the host NAT – same path as bare `docker run`.
    network_mode: bridge
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy

# Persistent Data Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
