  # # 2. Redis Pub/Sub & Caching Service
  # redis:
  #   image: redis:7-alpine
  #   container_name: statuo_redis
  #   restart: unless-stopped
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
